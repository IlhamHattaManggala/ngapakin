name: Publish to PyPI & GitHub Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Test Suite
        run: |
          python ngapakin.py test

  publish-pypi:
    name: Build & Publish Package to PyPI
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build binary wheel and source distribution
        run: |
          python -m build

      - name: Verify package archives
        run: |
          python -m twine check dist/*

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m twine upload --skip-existing dist/*

  release-windows-binary:
    name: Build Windows Executable (.exe) & GitHub Release
    needs: [test, publish-pypi]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip pyinstaller

      - name: Build ngapakin.exe
        run: |
          pyinstaller --onefile --name ngapakin --collect-all ngapak --collect-all framework --clean ngapakin.py

      - name: Create GitHub Release and Upload ngapakin.exe
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/ngapakin.exe
          generate_release_notes: true
